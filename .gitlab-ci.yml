workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
stages: [inspect]
receipt-review:
  stage: inspect
  image: ubuntu:24.04
  tags: [saas-linux-small-amd64]
  timeout: 5m
  variables:
    DEBIAN_FRONTEND: noninteractive
  script:
    - |
      set -Eeuo pipefail
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends curl ca-certificates unzip
      mkdir receipt-review
      curl --fail --silent --show-error --location --max-time 120 \
        'https://gitlab.com/aa22396584/telltale/-/jobs/16604391702/artifacts/download' \
        -o receipts.zip
      unzip -t receipts.zip > receipt-review/archive-check.txt
      for path in ci-artifacts/mode08-required/guard/attempt.json ci-artifacts/mode08-required/result.json ci-artifacts/apks.sha256 ci-artifacts/source.stdout; do
        printf '\n=== %s ===\n' "$path"
        unzip -p receipts.zip "$path" | tee "receipt-review/$(basename "$path")"
      done
      echo READ_ONLY_RECEIPTS_END
  artifacts:
    when: always
    expire_in: 7 days
    paths: [receipt-review/]
