# On-demand gate for Grok box project runner (tags: grok-box, ondemand, telltale).
stages:
  - gate

default:
  interruptible: true

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1536m -Dorg.gradle.daemon=false"
  # Used by the non-root wrapper below.
  FLUTTER_HOME: "/opt/flutter"

full-gate:
  stage: gate
  tags:
    - grok-box
    - ondemand
    - telltale
  image: ghcr.io/project516/flutter:3.47.0
  timeout: 3h
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  cache:
    key: pub-3.47.0
    paths:
      - .pub-cache/
  before_script:
    # release_notes_contract_test uses chmod 000; root can still read those files.
    - |
      set -e
      if [ "$(id -u)" = "0" ]; then
        if ! id -u flutter >/dev/null 2>&1; then
          useradd -m -u 1000 -s /bin/bash flutter
        fi
        # Discover flutter SDK for PATH
        if [ -x /opt/flutter/bin/flutter ]; then
          export FLUTTER_HOME=/opt/flutter
        elif [ -x /flutter/bin/flutter ]; then
          export FLUTTER_HOME=/flutter
        else
          FLUTTER_BIN=$(command -v flutter)
          export FLUTTER_HOME=$(dirname "$(dirname "$FLUTTER_BIN")")
        fi
        echo "FLUTTER_HOME=$FLUTTER_HOME"
        chown -R flutter:flutter "$CI_PROJECT_DIR" "$FLUTTER_HOME" || chown -R flutter:flutter "$CI_PROJECT_DIR"
        printf '%s\n' '#!/bin/bash' 'set -euo pipefail' "export PATH=\"$FLUTTER_HOME/bin:\$PATH\"" "export PUB_CACHE=\"$CI_PROJECT_DIR/.pub-cache\"" "export GRADLE_OPTS=\"$GRADLE_OPTS\"" "cd \"$CI_PROJECT_DIR\"" 'exec "$@"' > /usr/local/bin/as-flutter
        chmod 755 /usr/local/bin/as-flutter
      fi
  script:
    - |
      run() {
        if [ "$(id -u)" = "0" ]; then
          runuser -u flutter -- /usr/local/bin/as-flutter "$@"
        else
          "$@"
        fi
      }
      run flutter --version
      run flutter config --no-analytics
      run flutter pub get
      run flutter analyze
      run flutter test
      run flutter build apk --debug --flavor field
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - build/app/outputs/flutter-apk/*.apk
