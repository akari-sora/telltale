workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
stages: [device]
android-bootstrap:
  stage: device
  image: docker.io/plugfox/flutter:3.47.0-android@sha256:9cc3fb4d2c742c21d8bb6ab16eef657810b27ac78429920c6cd644dc8e158e22
  tags: [saas-linux-medium-amd64]
  timeout: 15m
  variables:
    ANDROID_HOME: /opt/android
    ANDROID_SDK_ROOT: /opt/android
    DEBIAN_FRONTEND: noninteractive
  script:
    - |
      set -Eeuo pipefail
      mkdir -p android-probe
      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
      cleanup() { rc=$?; trap - EXIT; if [ -n "${EMU_PID:-}" ]; then kill "$EMU_PID" 2>/dev/null || true; wait "$EMU_PID" 2>/dev/null || true; fi; printf '%s\n' "$rc" > android-probe/runner.exit; exit "$rc"; }
      trap cleanup EXIT
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends python3 curl unzip libpulse0 libnss3 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libasound2t64 libxdamage1 libxfixes3 libegl1 libglu1-mesa
      printf 'KVM available: '; test -e /dev/kvm && ls -l /dev/kvm || true
      grep -m1 -E 'flags|Features' /proc/cpuinfo | cut -c1-250 || true
      curl --fail --location --connect-timeout 20 --max-time 180 'https://gitlab.com/-/project/86385809/uploads/d8e09b9fb28e5873dee1b5c28bac2bce/gate2_candidate_acceptance_export.zip' -o original.zip
      echo 'bbb685afb4916cd336fe3db7f316ecdbf5de980dabfc645456861485336e3cef  original.zip' | sha256sum -c -
      unzip -p original.zip gate2_candidate_acceptance_export/candidate/app-field-debug.apk > candidate.apk
      echo 'acc80f75b599d7f85e5c11416ec6c2e92f774f6b9e1699584414ca35abbade9e  candidate.apk' | sha256sum -c - | tee android-probe/apk-check.txt
      set +e
      yes | sdkmanager --licenses > android-probe/licenses.log 2>&1
      rc=${PIPESTATUS[1]}
      set -e
      test "$rc" = 0
      sdkmanager --install emulator platform-tools 'system-images;android-36;google_apis;x86_64' > android-probe/sdk-install.log 2>&1
      echo no | avdmanager create avd --name gate2_isolated --package 'system-images;android-36;google_apis;x86_64' --device pixel_6
      emulator -avd gate2_isolated -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel off -memory 3072 -cores 4 -port 5554 > android-probe/emulator.log 2>&1 &
      EMU_PID=$!
      booted=0
      for i in $(seq 1 90); do
        if ! kill -0 "$EMU_PID" 2>/dev/null; then tail -n 100 android-probe/emulator.log; exit 1; fi
        boot=$(timeout 5 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
        if [ "$boot" = 1 ]; then booted=1; break; fi
        if [ $((i % 6)) = 0 ]; then echo "Waiting for Android boot attempt=$i"; fi
        sleep 5
      done
      test "$booted" = 1
      adb -s emulator-5554 shell getprop > android-probe/device-props.txt
      adb -s emulator-5554 shell wm size 1080x2424
      adb -s emulator-5554 shell settings put global window_animation_scale 0
      adb -s emulator-5554 shell settings put global transition_animation_scale 0
      adb -s emulator-5554 shell settings put global animator_duration_scale 0
      adb -s emulator-5554 install --no-streaming candidate.apk | tee android-probe/install.txt
      adb -s emulator-5554 shell am start -W -n com.cbstudio.telltale/.MainActivity | tee android-probe/launch.txt
      sleep 10
      adb -s emulator-5554 shell uiautomator dump /sdcard/window.xml
      adb -s emulator-5554 pull /sdcard/window.xml android-probe/window.xml
      cat android-probe/window.xml
      adb -s emulator-5554 exec-out screencap -p > android-probe/initial.png
      sha256sum android-probe/initial.png
      echo 'ANDROID_BOOTSTRAP_ONLY_NOT_D05_PASS'
  artifacts:
    when: always
    expire_in: 7 days
    paths: [android-probe/]
