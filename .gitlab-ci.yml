# Temporary executor preflight branch only, not a replacement for main CI.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
stages: [inspect]
android-d05-executor-preflight:
  stage: inspect
  image: localhost/telltale-ci-flutter:3.47.0
  tags: [grok-box, ondemand, telltale]
  timeout: 5m
  script:
    - |
      set -Eeuo pipefail
      mkdir -p d05-executor-preflight
      python3 - <<'PY'
      import json, os, platform, shutil
      from pathlib import Path
      sdk = Path(os.environ.get('ANDROID_SDK_ROOT', '/opt/android-sdk-linux'))
      data = {
          'kind': 'read_only_executor_inventory',
          'android_executed': False,
          'apk_installed': False,
          'platform': platform.system(),
          'machine': platform.machine(),
          'cpu_count': os.cpu_count(),
          'kvm_exists': Path('/dev/kvm').exists(),
          'kvm_read_write': os.access('/dev/kvm', os.R_OK | os.W_OK),
          'tools': {name: shutil.which(name) for name in ('python3','flutter','adb','emulator','sdkmanager')},
          'sdk_emulator_exists': (sdk/'emulator'/'emulator').is_file(),
          'sdk_platform_tools_exists': (sdk/'platform-tools'/'adb').is_file(),
          'system_images': sorted(str(p.relative_to(sdk)) for p in (sdk/'system-images').glob('*/*/*/package.xml')),
          'pipeline_id': os.environ.get('CI_PIPELINE_ID'),
          'job_id': os.environ.get('CI_JOB_ID'),
          'commit': os.environ.get('CI_COMMIT_SHA'),
      }
      Path('d05-executor-preflight/result.json').write_text(json.dumps(data, indent=2)+'\n')
      print(json.dumps(data, indent=2))
      PY
      echo 'EXECUTOR_INVENTORY_ONLY_NOT_DEVICE_PASS'
  artifacts:
    when: always
    expire_in: 7 days
    paths: [d05-executor-preflight/]
