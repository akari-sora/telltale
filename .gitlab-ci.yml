# All gates on the Grok on-demand project Runner (no SaaS for full-gate*).
# Pull the verified public Flutter image by immutable digest on the selected host.
stages: [gate]

default:
  interruptible: true

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1536m -Dorg.gradle.daemon=false -Djava.net.preferIPv4Stack=true"
  ANDROID_HOME: "/opt/android"
  ANDROID_SDK_ROOT: "/opt/android"

.gate-common:
  stage: gate
  timeout: 1h
  tags: [grok-box, ondemand, telltale]
  image: docker.io/plugfox/flutter@sha256:9cc3fb4d2c742c21d8bb6ab16eef657810b27ac78429920c6cd644dc8e158e22
  cache:
    key: pub-3.47.0
    paths: [.pub-cache/]
  before_script:
    - bash tool/ci/prepare_gate.sh
  script:
    - |
      set -Eeuo pipefail
      if [ "$(id -u)" = 0 ]; then
        runuser -u "$(cat /tmp/ci-nonroot-user)" -- /usr/local/bin/as-nonroot bash tool/ci/full_gate.sh
      else
        bash tool/ci/full_gate.sh
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/
      - build/app/outputs/flutter-apk/*.apk

full-gate:
  extends: .gate-common
  rules:
    - if: '$CI_GATE_RUNNER == "hosted"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Same-project MRs also use the Grok runner (queued behind on-demand wake).
# Fork MRs still cannot use this project's runner via these rules.
full-gate-mr:
  extends: .gate-common
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_ID == "86385809" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: '$CI_GATE_RUNNER == "hosted" && $CI_PROJECT_ID == "86385809" && ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH'
      when: never
