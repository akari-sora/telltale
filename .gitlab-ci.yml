workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
stages: [inspect]
variables:
  GIT_DEPTH: "0"
source-review-export:
  stage: inspect
  image: ubuntu:24.04
  tags: [saas-linux-small-amd64]
  timeout: 15m
  script:
    - |
      set -Eeuo pipefail
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends git ca-certificates
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      git fetch --no-tags origin main:refs/remotes/origin/main
      mkdir source-review
      git bundle create source-review/repository.bundle HEAD refs/remotes/origin/main
      git rev-parse HEAD refs/remotes/origin/main > source-review/refs.txt
      set +e
      git merge-tree --write-tree 25253474501f7460572de4cf77c666c0d8a2900a refs/remotes/origin/main > source-review/merge-tree.txt
      rc=$?
      set -e
      printf '%s\n' "$rc" > source-review/merge-tree.exit
      test "$rc" -le 1
      sha256sum source-review/repository.bundle > source-review/bundle.sha256
  artifacts:
    when: always
    expire_in: 2 days
    paths: [source-review/]
