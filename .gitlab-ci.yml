# Temporary API-only Android lane; no change to main or the Grok wake policy.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
stages: [device]
android-d05-fixed-apk:
  stage: device
  image: localhost/telltale-ci-flutter:3.47.0
  tags: [grok-box, ondemand, telltale]
  timeout: 40m
  variables:
    ANDROID_HOME: /opt/android-sdk-linux
    ANDROID_SDK_ROOT: /opt/android-sdk-linux
    DEBIAN_FRONTEND: noninteractive
  script:
    - |
      set -Eeuo pipefail
      mkdir -p d05-device .d05-runtime
      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
      export ANDROID_AVD_HOME="$CI_PROJECT_DIR/.d05-runtime/avd"
      export ANDROID_USER_HOME="$CI_PROJECT_DIR/.d05-runtime/android"
      mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
      stage=prepare
      cleanup() {
        rc=$?
        trap - EXIT
        if [ -n "${EMU_PID:-}" ]; then
          kill "$EMU_PID" 2>/dev/null || true
          for i in $(seq 1 10); do kill -0 "$EMU_PID" 2>/dev/null || break; sleep 1; done
          if kill -0 "$EMU_PID" 2>/dev/null; then kill -KILL "$EMU_PID" 2>/dev/null || true; fi
          wait "$EMU_PID" 2>/dev/null || true
        fi
        printf '%s\n' "$rc" > d05-device/runner.exit
        printf '%s\n' "$stage" > d05-device/last-stage.txt
        tail -n 80 d05-device/emulator.log 2>/dev/null || true
        (cd d05-device && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
        exit "$rc"
      }
      trap cleanup EXIT
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends python3 curl unzip libpulse0 libnss3 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libasound2t64 libxdamage1 libxfixes3 libegl1 libglu1-mesa libxkbcommon0 libxkbcommon-x11-0
      python3 -m py_compile tool/verification/d05_android_controller.py
      python3 tool/verification/test_d05_android_controller.py
      printf 'KVM: '; ls -l /dev/kvm 2>/dev/null || true
      free -m; df -h .
      emulator -version > d05-device/emulator-version.txt 2>&1
      if curl -fsSL --connect-timeout 15 --max-time 30 --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/86385809/jobs/16604411708/artifacts" -o .d05-runtime/prior.zip; then
        unzip -p .d05-runtime/prior.zip android-probe/emulator.log | tail -n 60 > d05-device/prior-emulator-tail.txt || true
        cat d05-device/prior-emulator-tail.txt
      fi
      curl -fL --connect-timeout 20 --max-time 240 'https://gitlab.com/-/project/86385809/uploads/d8e09b9fb28e5873dee1b5c28bac2bce/gate2_candidate_acceptance_export.zip' -o .d05-runtime/original.zip
      echo 'bbb685afb4916cd336fe3db7f316ecdbf5de980dabfc645456861485336e3cef  .d05-runtime/original.zip' | sha256sum -c -
      unzip -p .d05-runtime/original.zip gate2_candidate_acceptance_export/candidate/app-field-debug.apk > candidate.apk
      echo 'acc80f75b599d7f85e5c11416ec6c2e92f774f6b9e1699584414ca35abbade9e  candidate.apk' | sha256sum -c - | tee d05-device/apk-check.txt
      sha256sum candidate.apk > d05-device/candidate.sha256
      stage=android-image
      set +e
      yes | sdkmanager --licenses > d05-device/licenses.log 2>&1
      sdk_rc=${PIPESTATUS[1]}
      set -e
      test "$sdk_rc" = 0
      # Separate Android10 row. Smaller image for this no-KVM executor.
      sdkmanager --install 'system-images;android-29;default;x86_64' > d05-device/sdk-install.log 2>&1
      echo no | avdmanager create avd --name d05_isolated --package 'system-images;android-29;default;x86_64' --device pixel
      cat >> "$ANDROID_AVD_HOME/d05_isolated.avd/config.ini" <<'EOF'
      hw.lcd.width=480
      hw.lcd.height=800
      hw.lcd.density=160
      hw.keyboard=yes
      hw.gpu.enabled=yes
      hw.gpu.mode=swiftshader_indirect
      showDeviceFrame=no
      EOF
      cp "$ANDROID_AVD_HOME/d05_isolated.avd/config.ini" d05-device/avd-config.ini
      cp "$ANDROID_HOME/system-images/android-29/default/x86_64/source.properties" d05-device/system-image.properties
      stage=android-boot
      adb start-server
      emulator -avd d05_isolated -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -feature -Vulkan -accel off -memory 2048 -cores 2 -skin 480x800 -camera-back none -camera-front none -port 5580 -show-kernel > d05-device/emulator.log 2>&1 &
      EMU_PID=$!
      booted=0
      deadline=$((SECONDS+900))
      while [ "$SECONDS" -lt "$deadline" ]; do
        if ! kill -0 "$EMU_PID" 2>/dev/null; then echo EMULATOR_EXITED; exit 1; fi
        value=$(timeout 5 adb -s emulator-5580 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
        if [ "$value" = 1 ]; then booted=1; break; fi
        printf 'ANDROID_BOOT_WAIT elapsed=%s value=%s\n' "$SECONDS" "$value"
        sleep 10
      done
      if [ "$booted" != 1 ]; then
        timeout 10 adb -s emulator-5580 logcat -d -t 150 > d05-device/boot-logcat.txt 2>&1 || true
        timeout 10 adb -s emulator-5580 shell getprop > d05-device/boot-props.txt 2>&1 || true
        echo BOOTSTRAP_FAILED_D05_NOT_RUN
        exit 1
      fi
      stage=install-fixed-apk
      adb -s emulator-5580 shell getprop > d05-device/device-props.txt
      adb -s emulator-5580 shell wm size 480x800
      adb -s emulator-5580 shell wm density 160
      adb -s emulator-5580 shell settings put global window_animation_scale 0
      adb -s emulator-5580 shell settings put global transition_animation_scale 0
      adb -s emulator-5580 shell settings put global animator_duration_scale 0
      adb -s emulator-5580 shell settings put system screen_off_timeout 600000
      timeout 180 adb -s emulator-5580 install --no-streaming candidate.apk | tee d05-device/install.txt
      adb -s emulator-5580 shell pm path com.cbstudio.telltale > d05-device/package-path.txt
      installed=$(tr -d '\r' < d05-device/package-path.txt | sed -n 's/^package://p' | head -n 1)
      test -n "$installed"
      adb -s emulator-5580 shell sha256sum "$installed" > d05-device/installed-apk.sha256
      grep -q '^acc80f75b599d7f85e5c11416ec6c2e92f774f6b9e1699584414ca35abbade9e ' d05-device/installed-apk.sha256
      adb -s emulator-5580 shell dumpsys package com.cbstudio.telltale > d05-device/package-dump.txt
      stage=device-controller
      timeout --signal=TERM --kill-after=15 1000 python3 -u tool/verification/d05_android_controller.py
      stage=observations-captured-pending-review
  artifacts:
    when: always
    expire_in: 14 days
    paths: [d05-device/]
