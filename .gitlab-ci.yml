workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
stages: [inspect]
variables:
  GIT_DEPTH: "0"
source-review-export:
  stage: inspect
  image: ubuntu:24.04
  tags: [saas-linux-small-amd64]
  timeout: 10m
  script:
    - |
      set -Eeuo pipefail
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends git ca-certificates
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      git fetch --no-tags origin main:refs/remotes/origin/main
      mkdir source-review
      git rev-parse refs/remotes/origin/main
      set +e
      git merge-tree --write-tree 25253474501f7460572de4cf77c666c0d8a2900a refs/remotes/origin/main > source-review/merge-tree.txt
      rc=$?
      set -e
      cat source-review/merge-tree.txt
      test "$rc" -le 1
      git diff --stat 546b2aa70f90c14bb4045a6e922a5b3929445328 refs/remotes/origin/main
      echo REVIEW_DIAGNOSTICS_END
  artifacts:
    when: always
    expire_in: 2 days
    paths: [source-review/]
