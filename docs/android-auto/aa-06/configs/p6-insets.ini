# P6 — Insets Stress (1280x720 @ 160dpi, with content insets)
# Verifies host chrome and safe content boundary rendering
[general]
inputmode = touch
resolution = 1280x720
dpi = 160
framerate = 30
contentinsets = 32,32,32,32
stablecontentinsets = 32,32,32,32

[sensors]
speed = true
parking_brake = true
gear = true
night_mode = true
driving_status = true
